<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>DOO/IT – Kontrollmodul</title>
<style>
    body { background:#111; color:#eee; font-family:Arial; padding:20px; }
    button { padding:10px 20px; margin:5px; background:#333; color:#fff; border:1px solid #555; }
    #log { margin-top:20px; padding:10px; background:#222; border:1px solid #444; }
</style>
</head>
<body>

<h1>DOO/IT – Kontrollmodul</h1>
<p>Testfunktionen für Übergänge und Kontrolle.</p>

<button onclick="activate()">DOO/IT aktivieren</button>
<button onclick="transition()">Übergang erzeugen</button>
<button onclick="tmp()">TMP Übergang</button>

<div id="log">System bereit.</div>

<script>
const System = {
    control: false,
    transition: false,
    state: "idle"
};

function activate() {
    System.control = true;
    System.state = "control-ready";
    log("DOO/IT aktiviert → Kontrolle bereit.");
}

function transition() {
    if (!System.control) {
        log("Keine Kontrolle → Übergang nicht möglich.");
        return;
    }
    System.transition = true;
    System.state = "stable-transition";
    log("Stabiler Übergang erzeugt.");
}

function tmp() {
    System.transition = true;
    System.state = "tmp-transition";
    log("TMP Übergang erzeugt → ohne Kontrolle.");
}

function log(msg) {
    document.getElementById("log").innerHTML = msg;
}
</script>

</body>
</html>
